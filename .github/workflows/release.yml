name: Release

# Runs when CI passes on main. If the version in extension/manifest.json has no
# GitHub release yet, it publishes one with both store packages and submits them
# to Firefox Add-ons and the Chrome Web Store. Starting it by hand submits the
# current version to the stores again, for example after a failed submission.
# Each store needs a repository variable and a secret; without them it is skipped:
#   Firefox: variable AMO_API_KEY (JWT issuer), secret AMO_API_SECRET (JWT secret)
#   Chrome:  variable CHROME_PUBLISHER_ID, secret CHROME_SERVICE_ACCOUNT_KEY (JSON key)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      submit: ${{ steps.release.outputs.submit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: version
        run: echo "version=$(jq -r .version extension/manifest.json)" >> "$GITHUB_OUTPUT"
      - id: release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION already has a GitHub release."
            if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then exit 0; fi
            # Submits the packages and notes of the release, not a new build of main.
            gh release download "v$VERSION" --pattern '*.zip' --dir dist
            echo "sha=$(gh api "repos/$GH_REPO/commits/v$VERSION" --jq .sha)" >> "$GITHUB_OUTPUT"
          else
            npm run build
            node scripts/release-notes.js > "$RUNNER_TEMP/release-notes.md"
            gh release create "v$VERSION" dist/*.zip --target "$SHA" --title "$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          fi
          echo "submit=true" >> "$GITHUB_OUTPUT"
      - if: steps.release.outputs.submit == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: dist/*.zip
          if-no-files-found: error

  firefox:
    needs: release
    if: needs.release.outputs.submit == 'true' && vars.AMO_API_KEY != ''
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - run: unzip -q "dist/typewhisper-firefox-$VERSION.zip" -d dist/firefox
      - run: node scripts/release-notes.js --amo > "$RUNNER_TEMP/amo-metadata.json"
      # Submits the version for review and returns; Firefox Add-ons publishes it once approved.
      - run: npx web-ext sign --source-dir dist/firefox --channel listed --amo-metadata "$RUNNER_TEMP/amo-metadata.json" --approval-timeout 0
        env:
          WEB_EXT_API_KEY: ${{ vars.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}

  chrome:
    needs: release
    if: needs.release.outputs.submit == 'true' && vars.CHROME_PUBLISHER_ID != ''
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      # Submits the version for review; the Chrome Web Store publishes it once approved.
      - run: node scripts/publish-chrome.js "dist/typewhisper-chrome-$VERSION.zip"
        env:
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_KEY }}
